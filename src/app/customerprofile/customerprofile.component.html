<section>
    <div class="name">
        <div class="customerLogo">
            <img src="./icons/building.svg" alt="">
        </div>

        <!-- <h2>{{customer.name}}</h2> -->

        <input class="nameInput" [ngClass]="{'inputActivated': isEdit}" type="text" [(ngModel)]="customer.name"
            placeholder="Firmenname">



        <div class="icons"
            (click)="sharedservice.changeComponents('customers'); sharedservice.changeTemplate('details');resetCuntomer()">
            <img src="./icons/close.svg" alt="">
        </div>
    </div>
    <input class="branchInput" [ngClass]="{'inputActivated': isEdit}" type="text" [(ngModel)]="customer.branch"
        placeholder="Branche">




    <div class="menubar">
        <div class="tabs">
            <h3 (click)="sharedservice.changeTemplate('details')">Kundendaten</h3>
            <h3 (click)="sharedservice.changeTemplate('contacts')">Kontakte</h3>
            <h3 (click)="sharedservice.changeTemplate('tasks')">Aufgaben</h3>
        </div>
        <div class="depiction" *ngIf="sharedservice.customerTemplate!=='details'">
            <div class="icons" (click)="sharedservice.changeDepiction('list')">
                <img src="./icons/list.svg" alt="">
            </div>
            <div class="icons" (click)="sharedservice.changeDepiction('cards')">
                <img src="./icons/cards.svg" alt="">
            </div>
        </div>

    </div>




    <div class="templateContainer">
        <!-- Dashboard -->
        <div *ngIf="sharedservice.customerTemplate==='details'" class="costumerDetails">
            <div class="adress">
                <h3>Adresse</h3>
                <input [ngClass]="{'inputActivated': isEdit}" [(ngModel)]="customer.street" type="text"
                    placeholder="Straße">
                <div *ngIf="isEdit" class="cityData">
                    <input [ngClass]="{'inputActivated': isEdit}" [(ngModel)]="customer.areacode" type="text"
                        placeholder="Postleitzahl">
                    <input [ngClass]="{'inputActivated': isEdit}" [(ngModel)]="customer.city" type="text"
                        placeholder="Stadt">
                </div>
                <div *ngIf="!isEdit" [ngClass]="{'fontSize':customer.areacode || !customer.city}" class="cityData">
                    <p>{{customer?.areacode || 'Postleitzahl'}}</p>
                    <p>{{customer?.city || 'Stadt'}}</p>
                </div>

            </div>



            <div class="contactDataContainer">
                <h3>Kontaktdaten</h3>
                <div class="contactData">
                    <img src="./icons/phone.svg" alt="">
                    <input [ngClass]="{'inputActivated': isEdit}" [(ngModel)]="customer.phone" type="text"
                        placeholder="Telefon">
                </div>
                <div class="contactData">
                    <img src="./icons/email.svg" alt="">
                    <input [ngClass]="{'inputActivated': isEdit}" [(ngModel)]="customer.email" type="text"
                        placeholder="E-Mail">
                </div>

            </div>
            <div class="description">
                <h3>Beschreibung</h3>

                <textarea [ngClass]="{'textFieldActivated': isEdit}" name="" [(ngModel)]="customer.description" id=""
                    placeholder="Beschreibe kurz was die Firma macht..."></textarea>
            </div>
            <!-- <div class="mainContactContainer">
                <h3>Hauptkontakt</h3>
                <input [ngClass]="{'inputActivated': isEdit}" type="text" placeholder="Name"
                    [(ngModel)]="mainContact.name">
                <input [ngClass]="{'inputActivated': isEdit}" type="text" placeholder="Funktion"
                    [(ngModel)]="mainContact.function">
                <div class="contactDataContainer">
                    <div class="contactData">
                        <img src="./icons/phone.svg" alt="">
                        <input [ngClass]="{'inputActivated': isEdit}" [(ngModel)]="mainContact.phone" type="text"
                            placeholder="Telefon">
                    </div>
                    <div class="contactData">
                        <img src="./icons/email.svg" alt="">
                        <input [ngClass]="{'inputActivated': isEdit}" [(ngModel)]="mainContact.email" type="text"
                            placeholder="E-Mail">
                    </div>

                </div>


            </div> -->

        </div>
        <!-- Contacts -->
        <app-contacts *ngIf="sharedservice.customerTemplate ==='contacts'"></app-contacts>
        <!-- Tasks -->

        <app-customertasks *ngIf="sharedservice.customerTemplate ==='tasks'"></app-customertasks>
    </div>









    <div class="editBtn" *ngIf="sharedservice.customerTemplate==='details'">
        <div *ngIf="!isEdit" class="icons">
            <img (click)="toggleEdit(true)" src="./icons/edit.svg" alt="">
        </div>
        <div *ngIf="isEdit" class="icons">
            <img (click)="saveEdit()" src="./icons/save.svg" alt="">
        </div>
    </div>







</section>
