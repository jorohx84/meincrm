    <div class="menubar">
        <div class="tabs">
            <button class="btn" (click)="changeTemplate('dashboard')">Dashbaord</button>
            <button class="btn" (click)="changeTemplate('contacts')">Kontakte</button>
            <button class="btn" (click)="changeTemplate('tasks')">Aufgabe</button>
        </div>

        <div class="depiction">
            <img (click)="sharedservice.changeDepiction('list')" src="./icons/list.svg" alt="">
            <img (click)="sharedservice.changeDepiction('cards')" src="./icons/cards.svg" alt="">
            <img (click)="sharedservice.changeComponents('customers'); changeTemplate('Dashbaord');resetCuntomer()" src="./icons/close.svg" alt="">
          
        </div>
    </div>




    <div class="templateContainer">
        <!-- Dashboard -->
        <div *ngIf="sharedservice.customerTemplate==='dashboard'" class="costumerDashboard">
            customerDashboard
        </div>
        <!-- Contacts -->
        <app-contacts *ngIf="sharedservice.customerTemplate ==='contacts'"></app-contacts>
        <!-- Tasks -->
        <app-tasks *ngIf="sharedservice.customerTemplate ==='tasks'"></app-tasks>
    </div>




</section>
