<section>
    <div class="name">
        <div class="customerLogo">
            <img src="./icons/building.svg" alt="">
        </div>

        <input class="nameInput required" name="Name" [ngClass]="{'inputActivated': isEdit}" type="text"
            [(ngModel)]="customer.name" placeholder="Firmenname" [disabled]="!isEdit">



      
    </div>
    <input class="branchInput required" name="Branche" [ngClass]="{'inputActivated': isEdit}" type="text"
        [(ngModel)]="customer.branch" placeholder="Branche" [disabled]="!isEdit">


    <div class="templateContainer">
        <!-- Dashboard -->
        <div class="costumerDetails">
            <div class="adress">
                <h3>Adresse</h3>
                <input class="required" name="Straße" [ngClass]="{'inputActivated': isEdit}"
                    [(ngModel)]="customer.street" type="text" placeholder="Straße" [disabled]="!isEdit">
                <div *ngIf="isEdit" class="cityData">
                    <input class="required" name="Postleitzahl" [ngClass]="{'inputActivated': isEdit}"
                        [(ngModel)]="customer.areacode" type="text" placeholder="Postleitzahl" [disabled]="!isEdit">
                    <input class="required" name="Stadt" [ngClass]="{'inputActivated': isEdit}"
                        [(ngModel)]="customer.city" type="text" placeholder="Stadt" [disabled]="!isEdit">
                </div>
                <div *ngIf="!isEdit" [ngClass]="{'fontSize':customer.areacode || customer.city}" class="cityData">
                    <p>{{customer?.areacode || 'Postleitzahl'}}</p>
                    <p>{{customer?.city || 'Stadt'}}</p>
                </div>

            </div>



            <div class="contactDataContainer">
                <h3>Kontaktdaten</h3>
                <div class="contactData">
                    <img src="./icons/phone.svg" alt="">
                    <input [ngClass]="{'inputActivated': isEdit}" [(ngModel)]="customer.phone" type="text"
                        placeholder="Telefon" [disabled]="!isEdit">
                </div>
                <div class="contactData">
                    <img src="./icons/email.svg" alt="">
                    <input [ngClass]="{'inputActivated': isEdit}" [(ngModel)]="customer.email" type="text"
                        placeholder="E-Mail" [disabled]="!isEdit">
                </div>

            </div>


            <div class="contactDataContainer" *ngIf="mainContact">
                <h3>Ansprechpartner</h3>
                <p *ngIf="isContactEmpty()">Ansprechpartner hinzufügen</p>
                <div class="contactDataContainer" *ngIf="!isContactEmpty()">
                    <p>{{mainContact.name}}</p>
                    <div class="contactData">
                        <img src="./icons/phone.svg" alt="">
                        <p>{{mainContact.phone}}</p>
                    </div>
                    <div class="contactData">
                        <img src="./icons/email.svg" alt="">
                        <p>{{mainContact.email }}</p>
                    </div>
                </div>


            </div>


            <div class="description">
                <h3>Beschreibung</h3>

                <textarea [ngClass]="{'textFieldActivated': isEdit}" name="" [(ngModel)]="customer.description" id=""
                    placeholder="Beschreibe kurz was die Firma macht..." [disabled]="!isEdit"></textarea>
            </div>
            <div class="description">
                <h3>Notizen</h3>

                <textarea (change)="saveNotes()" name="" [(ngModel)]="customer.notes" id=""
                    placeholder="Notizen"></textarea>
            </div>

        </div>
    </div>









    <div class="editBtn">

        <div (click)="setCustomerEdit(true)" *ngIf="!isEdit" class="icons">
            <img src="./icons/edit.svg" alt="">
        </div>
        <button (click)="saveCustomerData()" *ngIf="isEdit" class="icons">
            <img src="./icons/save.svg" alt="">
        </button>
        <div (click)="closeEditMode()" *ngIf="isEdit" class="icons">
            <img src="./icons/close.svg" alt="">
        </div>
        <!-- <div *ngIf="isEdit && sharedservice.isNewCustomer" class="icons">
            <img (click)="quitAddCustomer()" src="./icons/close.svg" alt="">
        </div> -->
        <div *ngIf="!isEdit" class="icons" (click)="deleteCustomer()">
            <img src="./icons/trash.svg" alt="">
        </div>

    </div>



    <div class="confirmContainer" *ngIf="sharedservice.confirmationOpen">
        <app-confirmation></app-confirmation>
    </div>

    <p>{{customer.mainContactID}}</p>
